<!doctype html>
<html lang="zh-CN">
<head>

  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23162544'/%3E%3Cpath d='M7 10.5 16 6l9 4.5-9 4.5-9-4.5Zm3 3.2V19c4 3 8 3 12 0v-5.3' fill='none' stroke='%236fe0cf' stroke-width='2.2' stroke-linejoin='round'/%3E%3C/svg%3E" />
  <style>

    .topbar{position:sticky;top:0;z-index:5;border-bottom:1px solid rgba(220,226,237,.9);background:rgba(247,248,251,.9);backdrop-filter:blur(18px)}.topbar-inner{width:min(1280px,calc(100% - 40px));min-height:74px;margin:auto;display:flex;align-items:center;gap:20px}.brand{display:flex;align-items:center;gap:11px;margin-right:20px}.brand-mark{width:38px;height:38px;display:grid;place-items:center;border-radius:12px;color:#7ae1d3;background:var(--ink);font-weight:850}.brand strong{display:block;font-size:.96rem}.brand span{display:block;color:var(--muted);font-size:.73rem}.primary-nav{align-self:stretch;display:flex;gap:24px}.nav-tab{position:relative;border:0;padding:0 2px;color:var(--muted);background:transparent;font-size:.9rem;font-weight:700;cursor:pointer}.nav-tab:after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:3px;border-radius:3px 3px 0 0;background:transparent}.nav-tab.active{color:var(--ink)}.nav-tab.active:after{background:var(--accent)}.top-count{margin-left:auto;color:var(--muted);font-size:.78rem}.upload-entry{min-height:38px;display:inline-flex;align-items:center;gap:7px;border:1px solid #d4dbea;border-radius:10px;padding:0 12px;color:#33466c;background:#fff;font-size:.78rem;font-weight:760;cursor:pointer}.upload-entry:hover{border-color:#aebde0;background:#f4f7ff}.upload-entry svg{width:16px;height:16px}
    .page{width:min(1280px,calc(100% - 40px));margin:0 auto;padding:42px 0 72px}.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;margin-bottom:28px}.eyebrow{margin:0 0 5px;color:var(--accent);font-size:.75rem;font-weight:850;letter-spacing:.12em;text-transform:uppercase}h1{margin:0;font-size:clamp(2rem,4vw,3.15rem);line-height:1.08;letter-spacing:-.055em}.hero p:last-child{max-width:650px;margin:11px 0 0;color:var(--muted);font-size:.94rem}.primary{min-height:43px;display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:0 17px;color:#fff;background:var(--ink);font-weight:750;cursor:pointer;box-shadow:0 9px 23px rgba(21,33,60,.15)}.primary:hover{background:#243352}.primary svg{width:18px;height:18px}

    .year-tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:22px 0 24px}.year-button{border:1px solid var(--line);border-radius:14px;padding:13px 15px;text-align:left;background:transparent;cursor:pointer;transition:.18s}.year-button:hover{border-color:#cbd4e4;background:#fff}.year-button.active{color:#fff;border-color:var(--ink);background:var(--ink);box-shadow:0 12px 28px rgba(21,33,60,.16)}.year-button strong{display:block;font-size:.92rem}.year-button span{color:var(--muted);font-size:.74rem}.year-button.active span{color:#aebad0}.section-head{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:14px}.section-head h2{margin:0;font-size:1.08rem}.section-head span{color:var(--muted);font-size:.8rem}
    .course-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px;align-items:start}.course-card{overflow:hidden;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface)}.course-card[open]{box-shadow:var(--shadow)}.course-card>summary{list-style:none;display:flex;align-items:center;gap:13px;padding:17px 18px;cursor:pointer}.course-card>summary::-webkit-details-marker,.subfolder-card>summary::-webkit-details-marker{display:none}.course-icon{width:42px;height:42px;flex:0 0 auto;display:grid;place-items:center;border-radius:13px;color:var(--blue);background:var(--blue-soft);font-size:.94rem;font-weight:850}.course-name{min-width:0}.course-name strong{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:.94rem}.course-name span{color:var(--muted);font-size:.74rem}.chevron{width:19px;height:19px;margin-left:auto;color:#8b95aa;transition:transform .18s}.course-card[open]>summary .chevron{transform:rotate(180deg)}.folder-list{display:grid;gap:9px;padding:12px 13px 13px;border-top:1px solid var(--line);background:#f7f9fc}.subfolder-card{overflow:hidden;border:1px solid #e1e6ef;border-radius:12px;background:#fff}.subfolder-card>summary{list-style:none;display:flex;align-items:center;gap:10px;min-height:48px;padding:9px 12px;cursor:pointer}.subfolder-card>summary:hover{background:#fafbfe}.folder-icon{width:31px;height:31px;flex:0 0 auto;display:grid;place-items:center;border-radius:9px;color:#5470bd;background:#eef2ff}.folder-icon svg{width:17px;height:17px}.folder-name{min-width:0;font-size:.81rem;font-weight:760}.folder-count{margin-left:auto;color:var(--muted);font-size:.7rem}.folder-chevron{width:16px;height:16px;color:#96a0b3;transition:transform .18s}.subfolder-card[open]>summary .folder-chevron{transform:rotate(180deg)}.subfolder-files{max-height:320px;overflow:auto;border-top:1px solid #e8ecf3;scrollbar-width:thin}.file-row{min-height:62px;display:grid;grid-template-columns:42px minmax(0,1fr) auto;gap:12px;align-items:center;padding:9px 13px;border-bottom:1px solid #edf0f5}.file-row:last-child{border-bottom:0}.file-type{width:39px;height:39px;display:grid;place-items:center;border-radius:10px;color:#9a3c48;background:#fff0f1;font-size:.63rem;font-weight:850}.file-type.DOCX,.file-type.DOC{color:#3260b3;background:#eaf1ff}.file-type.TEX,.file-type.PY,.file-type.C,.file-type.CPP,.file-type.H,.file-type.HPP{color:#546274;background:#eef1f5}.file-type.PNG,.file-type.JPG,.file-type.JPEG{color:#8b5794;background:#f7ebfa}.file-meta{min-width:0}.file-meta strong{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:.8rem;font-weight:680}.file-meta span{display:block;margin-top:2px;overflow:hidden;color:var(--muted);font-size:.69rem;text-overflow:ellipsis;white-space:nowrap}.download-button{min-width:54px;min-height:34px;display:inline-flex;align-items:center;justify-content:center;border:1px solid #d8dfea;border-radius:9px;padding:0 10px;color:#3558bd;background:#fff;text-decoration:none;font-size:.72rem;font-weight:760}.download-button:hover{border-color:#aebde4;background:#f2f5ff}.restricted-badge{min-width:54px;padding:5px 8px;border-radius:8px;color:#8992a5;background:#f0f2f5;text-align:center;font-size:.68rem}.empty{grid-column:1/-1;padding:64px 24px;border:1px dashed #ccd5e5;border-radius:var(--radius);color:var(--muted);text-align:center}.empty strong{display:block;margin-bottom:5px;color:var(--ink)}
    .notes-view[hidden],.resources-view[hidden]{display:none}.notes-toolbar{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:18px}.notes-toolbar p{margin:5px 0 0;color:var(--muted);font-size:.86rem}.notes-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.note-card{min-height:210px;display:flex;flex-direction:column;padding:19px;border:1px solid var(--line);border-radius:var(--radius);background:#fff}.note-card:hover{box-shadow:var(--shadow)}.note-card time{color:var(--accent);font-size:.7rem;font-weight:800}.note-card h3{margin:13px 0 8px;font-size:1rem}.note-card p{margin:0;color:var(--muted);font-size:.82rem;white-space:pre-wrap;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:5;overflow:hidden}.note-actions{display:flex;align-items:center;margin-top:auto;padding-top:18px}.note-tag{padding:3px 8px;border-radius:999px;color:#27645e;background:var(--accent-soft);font-size:.68rem}.text-button{margin-left:auto;border:0;color:var(--blue);background:transparent;font-size:.74rem;font-weight:750;cursor:pointer}
    dialog{width:min(520px,calc(100vw - 28px));padding:0;border:0;border-radius:20px;color:var(--ink);box-shadow:0 30px 100px rgba(4,12,32,.26)}dialog::backdrop{background:rgba(7,16,40,.54);backdrop-filter:blur(3px)}.modal-head{display:flex;align-items:center;justify-content:space-between;padding:20px 22px 16px;border-bottom:1px solid var(--line)}.modal-head h2{margin:0;font-size:1.06rem}.icon-button{width:34px;height:34px;border:0;border-radius:9px;background:transparent;cursor:pointer}.modal-body{display:grid;gap:14px;padding:20px 22px}.field{display:grid;gap:6px}.field label{font-size:.78rem;font-weight:750}.field input,.field textarea,.field select{width:100%;border:1px solid #d7deea;border-radius:10px;padding:10px 11px;color:var(--ink);background:#fbfcfe}.field textarea{min-height:150px;resize:vertical}.field-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.upload-info{padding:12px 13px;border:1px solid #cce6e1;border-radius:11px;color:#365d59;background:#effaf8;font-size:.76rem}.upload-info strong{display:block;margin-bottom:3px;color:#204945}.modal-foot{display:flex;justify-content:flex-end;gap:9px;padding:0 22px 21px}.secondary{min-height:40px;border:1px solid var(--line);border-radius:11px;padding:0 15px;background:#fff;font-weight:680;cursor:pointer}.danger{margin-right:auto;color:#b42f3f}.toast{position:fixed;right:24px;bottom:24px;z-index:10;padding:11px 15px;border-radius:11px;color:#fff;background:var(--ink);box-shadow:var(--shadow);font-size:.82rem;opacity:0;transform:translateY(8px);pointer-events:none;transition:.2s}.toast.show{opacity:1;transform:translateY(0)}
    @media(max-width:900px){.course-grid{grid-template-columns:1fr}.notes-grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:680px){.topbar-inner,.page{width:min(100% - 28px,1280px)}.topbar-inner{min-height:66px;gap:12px}.brand{margin-right:auto}.brand span,.top-count{display:none}.primary-nav{gap:15px}.upload-entry{width:38px;padding:0;justify-content:center}.upload-entry span{display:none}.page{padding-top:28px}.hero{align-items:center}.hero p:last-child{display:none}.control-panel{grid-template-columns:1fr}.mode-switch{display:grid;grid-template-columns:1fr 1fr}.year-tabs{grid-template-columns:repeat(2,1fr)}.notes-grid{grid-template-columns:1fr}.notes-toolbar{align-items:flex-start}.notes-toolbar .primary span{display:none}.notes-toolbar .primary{width:42px;padding:0}.field-grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <header class="topbar"><div class="topbar-inner">
    <div class="brand"><div class="brand-mark">学</div><div><strong>课程资料库</strong><span>Personal study archive</span></div></div>
    <nav class="primary-nav" aria-label="主要内容"><button class="nav-tab active" data-view="resources">全部资源</button><button class="nav-tab" data-view="notes">个人笔记</button></nav>
    <span class="top-count" id="topCount"></span><button class="upload-entry" id="uploadEntry" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 16V4m0 0-4 4m4-4 4 4M5 14v5h14v-5"/></svg><span>上传文件</span></button>
  </div></header>
  <main class="page">
    <section class="resources-view" id="resourcesView">
      <div class="hero"><div><p class="eyebrow">Course archive</p><h1>全部课程资源</h1><p>按学年和课程整理，从课件、教材到作业与复习笔记都集中在这里。</p></div></div>
      <div class="control-panel">
        <div class="mode-switch" aria-label="资源类型"><button class="mode-button active" data-mode="resource">课程资料</button><button class="mode-button" data-mode="note">课程笔记</button></div>
        <label class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="resourceSearch" type="search" aria-label="搜索课程资料" placeholder="搜索课程、文件或文件夹…"/><span class="search-key">⌘ K</span></label>
      </div>
      <div class="year-tabs" aria-label="选择学年">
        <button class="year-button active" data-year="1"><strong>大一</strong><span id="yearCount1"></span></button><button class="year-button" data-year="2"><strong>大二</strong><span id="yearCount2"></span></button><button class="year-button" data-year="3"><strong>大三</strong><span id="yearCount3"></span></button><button class="year-button" data-year="4"><strong>大四</strong><span id="yearCount4"></span></button>
      </div>
      <div class="section-head"><h2 id="sectionTitle">大一 · 课程资料</h2><span id="sectionCount"></span></div>
      <section class="course-grid" id="courseGrid" aria-live="polite"></section>
    </section>
    <section class="notes-view" id="notesView" hidden>
      <div class="notes-toolbar"><div><p class="eyebrow">Personal notes</p><h1>个人笔记</h1><p>随手记录学习想法、待办和复盘内容，仅保存在当前浏览器。</p></div><button class="primary" id="addNoteButton"><span>新建笔记</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg></button></div>
      <section class="notes-grid" id="notesGrid" aria-live="polite"></section>
    </section>
  </main>
  <dialog id="noteDialog"><form id="noteForm">
    <div class="modal-head"><h2 id="noteDialogTitle">新建个人笔记</h2><button class="icon-button" type="button" id="closeNote" aria-label="关闭">✕</button></div>
    <div class="modal-body"><div class="field"><label for="noteTitle">标题</label><input id="noteTitle" name="title" maxlength="80" required placeholder="这条笔记讲什么？"/></div><div class="field"><label for="noteTag">标签</label><input id="noteTag" name="tag" maxlength="24" placeholder="例如：本周复盘"/></div><div class="field"><label for="noteContent">内容</label><textarea id="noteContent" name="content" maxlength="2000" placeholder="写下你的想法…"></textarea></div></div>
    <div class="modal-foot"><button class="secondary danger" type="button" id="deleteNote" hidden>删除</button><button class="secondary" type="button" id="cancelNote">取消</button><button class="primary" type="submit">保存笔记</button></div>
  </form></dialog>
  <dialog id="uploadDialog"><form id="uploadForm">
    <div class="modal-head"><h2>上传课程文件</h2><button class="icon-button" type="button" id="closeUpload" aria-label="关闭">✕</button></div>
    <div class="modal-body">
      <div class="field-grid"><div class="field"><label for="uploadYear">学年</label><select id="uploadYear" required><option value="1">大一</option><option value="2">大二</option><option value="3">大三</option><option value="4">大四</option></select></div><div class="field"><label for="uploadKind">资源类型</label><select id="uploadKind" required><option value="resource">课程资料</option><option value="note">课程笔记</option></select></div></div>
      <div class="field"><label for="uploadCourse">课程</label><input id="uploadCourse" list="uploadCourseOptions" required maxlength="60" placeholder="选择或输入课程名称"/><datalist id="uploadCourseOptions"></datalist></div>
      <div class="field"><label for="uploadFolder">二级文件夹</label><input id="uploadFolder" list="uploadFolderOptions" required maxlength="40" placeholder="选择或输入文件夹名称"/><datalist id="uploadFolderOptions"></datalist></div>
      <div class="upload-info"><strong>通过 GitHub 安全上传</strong>下一步会打开 GitHub 官方页面。只有拥有仓库权限的账号可以提交；单个文件不超过 25MB，请勿上传教材或其他未获授权的内容。</div>
    </div>
    <div class="modal-foot"><button class="secondary" type="button" id="cancelUpload">取消</button><button class="primary" type="submit">前往 GitHub 上传</button></div>
  </form></dialog>
  <div class="toast" id="toast" role="status"></div>
  <script src="course-data.js?v=20261007-folders-downloads"></script>
  <script>
    const files=Array.isArray(window.COURSE_FILES)?window.COURSE_FILES:[];
    const GITHUB_REPO='tommyt-kkk/education-resource-hub',UPLOAD_ROOT='uploads';let uploadedFilesLoadedAt=0;
    const NOTE_KEY='personal-study-notes-v2';let currentMode='resource',currentYear=1,editingNoteId=null,personalNotes=loadNotes();
    const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
    function escapeHTML(v=''){return String(v).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
    function formatSize(b){if(b<1024)return`${b} B`;if(b<1048576)return`${(b/1024).toFixed(1)} KB`;return`${(b/1048576).toFixed(1)} MB`}
    function loadNotes(){try{const saved=JSON.parse(localStorage.getItem(NOTE_KEY));if(Array.isArray(saved))return saved;const legacy=JSON.parse(localStorage.getItem('education-resource-v1'));if(Array.isArray(legacy))return legacy.filter(x=>x.category==='note').map(x=>({id:x.id,title:x.title,tag:x.tag||'旧版笔记',content:x.description||'',updatedAt:x.createdAt||Date.now()}))}catch{}return[]}
    function saveNotes(){localStorage.setItem(NOTE_KEY,JSON.stringify(personalNotes))}function toast(m){const e=$('#toast');e.textContent=m;e.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>e.classList.remove('show'),1700)}function initials(n){return[...n].filter(c=>/[\p{L}\p{N}]/u.test(c)).slice(0,2).join('').toUpperCase()||'课'}
    const SUBFOLDER_ORDER=['课程课件','专题课件','教材与参考书','作业与报告','考试与练习','复习与总结','课程笔记','实验指导','实验预习','预习报告','实验报告','实验资料','课程说明与链接','代码与附件','报告与成果','其他资料'];
    function currentFiles(){const q=$('#resourceSearch').value.trim().toLowerCase();return files.filter(f=>f.year===currentYear&&f.kind===currentMode&&(!q||[f.course,f.name,f.folder,f.subfolder,f.extension].join(' ').toLowerCase().includes(q)))}
    function renderFile(f){const url=f.downloadUrl||f.downloadPath,action=url?`<a class="download-button" href="${escapeHTML(url)}" download="${escapeHTML(f.name)}"${f.downloadUrl?' target="_blank" rel="noopener"':''}>下载</a>`:'<span class="restricted-badge" title="教材未公开上传">未上传</span>';return`<div class="file-row"><span class="file-type ${escapeHTML(f.extension)}">${escapeHTML(f.extension.slice(0,4))}</span><span class="file-meta"><strong title="${escapeHTML(f.name)}">${escapeHTML(f.name)}</strong><span>${formatSize(f.bytes)}${f.githubUpload?' · GitHub 上传':''}</span></span>${action}</div>`}
    function renderSubfolder(name,entries,open){return`<details class="subfolder-card" ${open?'open':''}><summary><span class="folder-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 6.5h6l2 2h10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-11Z"/></svg></span><span class="folder-name">${escapeHTML(name)}</span><span class="folder-count">${entries.length} 个</span><svg class="folder-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg></summary><div class="subfolder-files">${entries.sort((a,b)=>a.name.localeCompare(b.name,'zh-CN')).map(renderFile).join('')}</div></details>`}
    function renderResources(){
      const visible=currentFiles(),query=$('#resourceSearch').value.trim(),searching=Boolean(query),grouped=visible.reduce((r,f)=>((r[f.course]??=[]).push(f),r),{}),courses=Object.keys(grouped).sort((a,b)=>a.localeCompare(b,'zh-CN'));
      $('#sectionTitle').textContent=`大${['一','二','三','四'][currentYear-1]} · ${currentMode==='resource'?'课程资料':'课程笔记'}`;
      $('#sectionCount').textContent=`${courses.length} 门课程 · ${visible.length} 个文件`;
      $('#courseGrid').innerHTML=courses.length?courses.map(course=>{const entries=grouped[course],folders=entries.reduce((r,f)=>((r[f.subfolder||'其他资料']??=[]).push(f),r),{}),names=Object.keys(folders).sort((a,b)=>(SUBFOLDER_ORDER.indexOf(a)<0?99:SUBFOLDER_ORDER.indexOf(a))-(SUBFOLDER_ORDER.indexOf(b)<0?99:SUBFOLDER_ORDER.indexOf(b))||a.localeCompare(b,'zh-CN'));return`<details class="course-card" ${searching?'open':''}><summary><span class="course-icon">${escapeHTML(initials(course))}</span><span class="course-name"><strong>${escapeHTML(course)}</strong><span>${names.length} 个文件夹 · ${entries.length} 个文件</span></span><svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg></summary><div class="folder-list">${names.map(name=>renderSubfolder(name,folders[name],searching)).join('')}</div></details>`}).join(''):`<div class="empty"><strong>${currentYear>2?'这个学年还没有资料':'没有找到匹配的文件'}</strong>${currentYear>2?'以后添加课程文件后，可以继续补充到这里。':'试试其他关键词或切换资源类型。'}</div>`;
      for(let y=1;y<=4;y++){const n=files.filter(f=>f.year===y&&f.kind===currentMode).length;$(`#yearCount${y}`).textContent=n?`${n} 个文件`:'暂未添加'}
      $('#topCount').textContent=`${files.length} 个课程文件`;
    }
    function renderNotes(){const sorted=[...personalNotes].sort((a,b)=>b.updatedAt-a.updatedAt);$('#notesGrid').innerHTML=sorted.length?sorted.map(n=>`<article class="note-card"><time>${new Date(n.updatedAt).toLocaleDateString('zh-CN')}</time><h3>${escapeHTML(n.title)}</h3><p>${escapeHTML(n.content||'暂无内容')}</p><div class="note-actions"><span class="note-tag">${escapeHTML(n.tag||'未分类')}</span><button class="text-button" data-edit-note="${escapeHTML(n.id)}">编辑</button></div></article>`).join(''):'<div class="empty"><strong>还没有个人笔记</strong>点击“新建笔记”，记录第一条学习想法。</div>'}
    function setView(v){$$('.nav-tab').forEach(b=>b.classList.toggle('active',b.dataset.view===v));$('#resourcesView').hidden=v!=='resources';$('#notesView').hidden=v!=='notes';v==='notes'?renderNotes():renderResources()}
    function openNote(id=null){editingNoteId=id;const n=personalNotes.find(x=>x.id===id);$('#noteDialogTitle').textContent=n?'编辑个人笔记':'新建个人笔记';$('#noteTitle').value=n?.title||'';$('#noteTag').value=n?.tag||'';$('#noteContent').value=n?.content||'';$('#deleteNote').hidden=!n;$('#noteDialog').showModal();setTimeout(()=>$('#noteTitle').focus(),50)}function closeNote(){$('#noteDialog').close();editingNoteId=null}
    function populateUploadChoices(){const year=Number($('#uploadYear').value),kind=$('#uploadKind').value,courseInput=$('#uploadCourse'),folderInput=$('#uploadFolder'),courses=[...new Set(files.filter(f=>f.year===year&&f.kind===kind).map(f=>f.course))].sort((a,b)=>a.localeCompare(b,'zh-CN'));$('#uploadCourseOptions').innerHTML=courses.map(x=>`<option value="${escapeHTML(x)}"></option>`).join('');if(!courseInput.value||!courses.includes(courseInput.value))courseInput.value=courses[0]||'';const folders=[...new Set(files.filter(f=>f.year===year&&f.kind===kind&&f.course===courseInput.value&&f.subfolder!=='教材与参考书').map(f=>f.subfolder))].filter(Boolean).sort((a,b)=>(SUBFOLDER_ORDER.indexOf(a)<0?99:SUBFOLDER_ORDER.indexOf(a))-(SUBFOLDER_ORDER.indexOf(b)<0?99:SUBFOLDER_ORDER.indexOf(b)));if(!folders.length)folders.push(kind==='note'?'课程笔记':'课程课件');$('#uploadFolderOptions').innerHTML=folders.map(x=>`<option value="${escapeHTML(x)}"></option>`).join('');if(!folderInput.value||!folders.includes(folderInput.value))folderInput.value=folders[0]}
    function openUpload(){setView('resources');$('#uploadYear').value=String(currentYear);$('#uploadKind').value=currentMode;$('#uploadCourse').value='';$('#uploadFolder').value='';populateUploadChoices();$('#uploadDialog').showModal()}function closeUpload(){$('#uploadDialog').close()}
    async function loadGithubUploads(force=false){if(!force&&Date.now()-uploadedFilesLoadedAt<15000)return;uploadedFilesLoadedAt=Date.now();try{const response=await fetch(`https://api.github.com/repos/${GITHUB_REPO}/git/trees/main?recursive=1`,{headers:{Accept:'application/vnd.github+json'}});if(!response.ok)throw new Error(`GitHub ${response.status}`);const data=await response.json();for(let i=files.length-1;i>=0;i--)if(files[i].githubUpload)files.splice(i,1);for(const item of data.tree||[]){if(item.type!=='blob'||!item.path.startsWith(`${UPLOAD_ROOT}/`))continue;const parts=item.path.split('/');if(parts.length<6)continue;const year=Number(parts[1]),kind=parts[2],course=parts[3],subfolder=parts[4],name=parts.slice(5).join('/');if(!year||!['resource','note'].includes(kind)||!course||!subfolder||!name||subfolder==='教材与参考书')continue;const extension=(name.includes('.')?name.split('.').pop():'FILE').toUpperCase();files.push({id:`github-${item.sha}`,year,course,name,path:item.path,folder:subfolder,subfolder,bytes:item.size||0,extension,kind,githubUpload:true,downloadUrl:`https://github.com/${GITHUB_REPO}/raw/refs/heads/main/${parts.map(encodeURIComponent).join('/')}`})}renderResources()}catch(error){console.warn('Unable to refresh GitHub uploads',error)}}
    $$('.nav-tab').forEach(b=>b.addEventListener('click',()=>setView(b.dataset.view)));$$('.mode-button').forEach(b=>b.addEventListener('click',()=>{currentMode=b.dataset.mode;$$('.mode-button').forEach(x=>x.classList.toggle('active',x===b));renderResources()}));$$('.year-button').forEach(b=>b.addEventListener('click',()=>{currentYear=Number(b.dataset.year);$$('.year-button').forEach(x=>x.classList.toggle('active',x===b));renderResources()}));$('#resourceSearch').addEventListener('input',renderResources);$('#addNoteButton').addEventListener('click',()=>openNote());$('#closeNote').addEventListener('click',closeNote);$('#cancelNote').addEventListener('click',closeNote);$('#notesGrid').addEventListener('click',e=>{const b=e.target.closest('[data-edit-note]');if(b)openNote(b.dataset.editNote)});$('#noteDialog').addEventListener('click',e=>{if(e.target===$('#noteDialog'))closeNote()});$('#uploadEntry').addEventListener('click',openUpload);$('#closeUpload').addEventListener('click',closeUpload);$('#cancelUpload').addEventListener('click',closeUpload);$('#uploadDialog').addEventListener('click',e=>{if(e.target===$('#uploadDialog'))closeUpload()});$('#uploadYear').addEventListener('change',()=>{$('#uploadCourse').value='';$('#uploadFolder').value='';populateUploadChoices()});$('#uploadKind').addEventListener('change',()=>{$('#uploadCourse').value='';$('#uploadFolder').value='';populateUploadChoices()});$('#uploadCourse').addEventListener('change',()=>{$('#uploadFolder').value='';populateUploadChoices()});
    $('#uploadForm').addEventListener('submit',e=>{e.preventDefault();const year=$('#uploadYear').value,kind=$('#uploadKind').value,course=$('#uploadCourse').value.trim(),folder=$('#uploadFolder').value.trim();if(!course||!folder)return;if(/[\\/]/.test(course+folder)){toast('课程和文件夹名称不能包含斜杠');return}if(folder==='教材与参考书'){toast('教材文件夹不提供上传');return}const segments=[UPLOAD_ROOT,year,kind,course,folder].map(encodeURIComponent),url=`https://github.com/${GITHUB_REPO}/upload/main/${segments.join('/')}`;window.location.href=url});
    $('#noteForm').addEventListener('submit',e=>{e.preventDefault();const d=new FormData(e.currentTarget),existing=personalNotes.find(x=>x.id===editingNoteId),note={id:editingNoteId||crypto.randomUUID(),title:d.get('title').trim(),tag:d.get('tag').trim(),content:d.get('content').trim(),updatedAt:Date.now()};personalNotes=existing?personalNotes.map(x=>x.id===editingNoteId?note:x):[note,...personalNotes];saveNotes();closeNote();renderNotes();toast(existing?'笔记已更新':'笔记已创建')});$('#deleteNote').addEventListener('click',()=>{if(!editingNoteId)return;personalNotes=personalNotes.filter(n=>n.id!==editingNoteId);saveNotes();closeNote();renderNotes();toast('笔记已删除')});document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();setView('resources');$('#resourceSearch').focus()}});
    function registerWebMCP(){const c=document.modelContext;if(!c?.registerTool)return;const register=t=>Promise.resolve(c.registerTool(t)).catch(()=>{});register({name:'list_course_files',title:'查找课程文件',description:'按学年、课程、资源类型或关键词查找课程文件。',inputSchema:{type:'object',properties:{year:{type:'integer',minimum:1,maximum:4},course:{type:'string'},kind:{type:'string',enum:['resource','note']},query:{type:'string'}},additionalProperties:false},annotations:{readOnlyHint:true,untrustedContentHint:true},execute(i={}){const q=String(i.query||'').toLowerCase();return files.filter(f=>(!i.year||f.year===i.year)&&(!i.course||f.course===i.course)&&(!i.kind||f.kind===i.kind)&&(!q||[f.course,f.name,f.folder,f.subfolder].join(' ').toLowerCase().includes(q))).map(({id,year,course,name,path,folder,subfolder,extension,kind})=>({id,year,course,name,path,folder,subfolder,extension,kind}))}});register({name:'create_personal_note',title:'创建个人笔记',description:'在个人笔记中创建一条新记录。',inputSchema:{type:'object',properties:{title:{type:'string'},tag:{type:'string'},content:{type:'string'}},required:['title'],additionalProperties:false},annotations:{readOnlyHint:false,untrustedContentHint:false},execute(i){if(!i||typeof i.title!=='string'||!i.title.trim())throw new Error('标题不能为空');const n={id:crypto.randomUUID(),title:i.title.trim().slice(0,80),tag:String(i.tag||'').trim().slice(0,24),content:String(i.content||'').trim().slice(0,2000),updatedAt:Date.now()};personalNotes=[n,...personalNotes];saveNotes();renderNotes();return{id:n.id,status:'created'}}})}
    renderResources();renderNotes();registerWebMCP();loadGithubUploads();document.addEventListener('visibilitychange',()=>{if(!document.hidden)loadGithubUploads(true)});
  </script>
</body>
